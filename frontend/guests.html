<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookMyRoom — Guests</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="app">
      <div class="page-header">
        <div class="page-header-left">
          <h2>Guests</h2>
          <p>Manage your guest directory.</p>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-primary" onclick="openGuestModal()">＋ Add Guest</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header"><h3>All Guests</h3></div>
        <div id="guestsContainer">
          <div class="inline-loader"><div class="spinner spinner-dark"></div> Loading guests...</div>
        </div>
      </div>

      <!-- Add/Edit Guest Modal -->
      <div class="modal-overlay" id="guestModal">
        <div class="modal">
          <div class="modal-header">
            <h3 id="guestModalTitle">Add Guest</h3>
            <button class="modal-close" onclick="closeModal('guestModal')">✕</button>
          </div>
          <form id="guestForm" onsubmit="submitGuest(event)">
            <div class="modal-body">
              <input type="hidden" id="guestId" />
              <div class="form-group">
                <label for="guestName">Full Name</label>
                <input type="text" id="guestName" class="form-control" placeholder="Jane Doe" required />
              </div>
              <div class="form-group">
                <label for="guestEmail">Email</label>
                <input type="email" id="guestEmail" class="form-control" placeholder="jane@example.com" required />
              </div>
              <div class="form-group">
                <label for="guestPhone">Phone</label>
                <input type="tel" id="guestPhone" class="form-control" placeholder="+91 98765 43210" required />
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" onclick="closeModal('guestModal')">Cancel</button>
              <button type="submit" class="btn btn-primary" id="guestSaveBtn">Save Guest</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/guests.js"></script>
  </body>
</html>
