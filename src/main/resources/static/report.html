<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon-cbDrXHSr.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookMyRoom — Occupancy Report</title>
    <link rel="stylesheet" crossorigin href="/assets/style-DhF6L55S.css">
  </head>
  <body>
    <div id="app">
      <div class="page-header">
        <div class="page-header-left">
          <h2>Occupancy Report</h2>
          <p>Generate monthly occupancy statistics.</p>
        </div>
      </div>

      <div class="filter-bar">
        <div class="form-group">
          <label for="reportYear">Year</label>
          <input type="number" id="reportYear" class="form-control" placeholder="e.g. 2026" min="2000" max="2100" />
        </div>
        <div class="form-group">
          <label for="reportMonth">Month</label>
          <select id="reportMonth" class="form-control">
            <option value="">Select month...</option>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </div>
        <div class="form-group" style="flex:0 0 auto">
          <button class="btn btn-primary" id="generateBtn" onclick="generateReport()">📊 Generate Report</button>
        </div>
      </div>

      <div id="reportResults">
        <div class="state-box">
          <div class="state-icon">📊</div>
          <div class="state-title">No report generated yet</div>
          <div class="state-msg">Select a year and month, then click Generate Report.</div>
        </div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/report.js"></script>
  </body>
</html>
